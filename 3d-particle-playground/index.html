<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Particle Playground</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Hidden video element for MediaPipe -->
    <video id="video" style="display: none;" autoplay playsinline></video>
    
    <!-- UI Overlay elements -->
    <div id="ui-container">
        <div id="camera-status">
            <span class="indicator red"></span> Camera: Disconnected
        </div>
        <div id="readme-panel">
            <h2>Gestures</h2>
            <ul>
                <li><strong>Hand Distance (X):</strong> Controls particle spread</li>
                <li><strong>Fist Tension:</strong> Controls particle scale</li>
                <li><strong>Quick Fist Snap:</strong> Fireworks!</li>
            </ul>
        </div>
    </div>

    <!-- Libraries -->
    <script src="libs/three.min.js"></script>
    <script src="libs/camera_utils.js"></script>
    <script src="libs/hands.js"></script>
    <script src="libs/dat.gui.min.js"></script>
    
    <!-- Main Script -->
    <script src="script.js"></script>
</body>
</html>
